<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forma - Let learn it</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Form to apply for web development course</h1>
    <form action="post">
    <div>
        <label for="username">Enter your Username :- </label>
        <input type="text" id="username" name="username" placeholder="Enter your username">
    </div>
    <div>
        <label for="username">female</label>  
        <input type="radio" id="female"  name="gender" value="female">
        <label for="username">male</label>
        <input type="radio" id="male"  name="gender" value="male">
    </div>
    <div>
        <input type="checkbox" id="subscribe" name="subscribe" value="yes">
        <label for="subscribe">Subscribe to newletter</label>
    </div>
    <div>
        <label for="comment">Enter your comment</label>
        <br>
        <textarea id="comment"  name="comment" rows="4" cols="40">Enter your comment here....</textarea>
    </div>
    <div>
        <label for="fruits">Select Any One Fruit</label>
        <select name="fruits" id="fruits">
            <option value="apple">Apple</option>
            <option value="banana">Banana</option>
            <option value="mango">Mango</option>
            <option value="grapes">Grapes</option>
        </select>
    </div>
 </form>
</body>
</html>
