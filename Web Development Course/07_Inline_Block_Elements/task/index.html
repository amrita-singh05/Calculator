<!--Quick Quiz:
without using br tag, write a vertically aligned form asking for name,
city and pincode of a user.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK 1</title>
</head>
<body>
    <form action="post">
    <div>
        <label for="name">Name :-</label>
        <input type="text" id="name"  placeholder="Enter your username" required>
    </div>

    <div>
        <label for="city">City :-</label>
        <input type="text" id="city"  placeholder="Enter your city" required>
    </div>

    <div>
        <label for="pincode">Pincode :-</label>
        <input type="text" id="pincode" placeholder="Enter your pincode" required>
    </div>
</form>

</body>
</html>
